<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Nexora — Premium Digital Studio">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="og-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="1000" cy="140" r="260" fill="url(#og-accent)" opacity="0.14"/>
  <circle cx="120" cy="560" r="200" fill="url(#og-accent)" opacity="0.10"/>

  <!-- Logo mark -->
  <rect x="100" y="120" width="96" height="96" rx="24" fill="url(#og-accent)"/>
  <path d="M126 196V136l44 60V136" fill="none" stroke="#FFFFFF" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="126" cy="136" r="7" fill="#FFFFFF"/>
  <circle cx="170" cy="196" r="7" fill="#FFFFFF"/>
  <text x="216" y="188" font-family="Poppins, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">Nexora</text>

  <!-- Headline -->
  <text x="100" y="340" font-family="Poppins, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF">Premium raqamli</text>
  <text x="100" y="424" font-family="Poppins, sans-serif" font-size="72" font-weight="800" fill="url(#og-accent)">mahsulotlar yaratamiz.</text>

  <!-- Sub -->
  <text x="100" y="492" font-family="Poppins, sans-serif" font-size="30" font-weight="400" fill="#94A3B8">Strategiya · Dizayn · Muhandislik — zamonaviy brendlar uchun</text>

  <!-- Chips -->
  <rect x="100" y="528" width="176" height="52" rx="26" fill="#1E293B"/>
  <text x="188" y="561" font-family="Poppins, sans-serif" font-size="22" font-weight="600" fill="#38BDF8" text-anchor="middle">Veb-dizayn</text>
  <rect x="292" y="528" width="176" height="52" rx="26" fill="#1E293B"/>
  <text x="380" y="561" font-family="Poppins, sans-serif" font-size="22" font-weight="600" fill="#38BDF8" text-anchor="middle">Dasturlash</text>
  <rect x="484" y="528" width="150" height="52" rx="26" fill="#1E293B"/>
  <text x="559" y="561" font-family="Poppins, sans-serif" font-size="22" font-weight="600" fill="#38BDF8" text-anchor="middle">Brending</text>
</svg>
