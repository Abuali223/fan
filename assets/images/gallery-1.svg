<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-label="Mobile banking application interface">
  <defs>
    <linearGradient id="g1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="g1-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g1-bg)"/>
  <circle cx="640" cy="120" r="180" fill="url(#g1-accent)" opacity="0.16"/>
  <!-- Phone frame -->
  <rect x="300" y="70" width="240" height="470" rx="34" fill="#0B1220" stroke="#334155" stroke-width="2"/>
  <rect x="360" y="86" width="120" height="14" rx="7" fill="#1E293B"/>
  <!-- Balance card -->
  <rect x="320" y="120" width="200" height="120" rx="18" fill="url(#g1-accent)"/>
  <rect x="340" y="142" width="70" height="10" rx="5" fill="#FFFFFF" opacity="0.7"/>
  <rect x="340" y="162" width="120" height="20" rx="6" fill="#FFFFFF"/>
  <rect x="340" y="206" width="60" height="9" rx="4.5" fill="#FFFFFF" opacity="0.6"/>
  <rect x="452" y="200" width="48" height="20" rx="10" fill="#FFFFFF" opacity="0.25"/>
  <!-- List rows -->
  <g>
    <rect x="320" y="262" width="200" height="46" rx="12" fill="#1E293B"/>
    <circle cx="344" cy="285" r="13" fill="url(#g1-accent)"/>
    <rect x="366" y="277" width="90" height="8" rx="4" fill="#64748B"/>
    <rect x="366" y="291" width="60" height="7" rx="3.5" fill="#334155"/>
    <rect x="486" y="281" width="20" height="8" rx="4" fill="#38BDF8"/>
  </g>
  <g>
    <rect x="320" y="318" width="200" height="46" rx="12" fill="#1E293B"/>
    <circle cx="344" cy="341" r="13" fill="#38BDF8" opacity="0.8"/>
    <rect x="366" y="333" width="80" height="8" rx="4" fill="#64748B"/>
    <rect x="366" y="347" width="54" height="7" rx="3.5" fill="#334155"/>
    <rect x="486" y="337" width="20" height="8" rx="4" fill="#38BDF8"/>
  </g>
  <g>
    <rect x="320" y="374" width="200" height="46" rx="12" fill="#1E293B"/>
    <circle cx="344" cy="397" r="13" fill="#2563EB"/>
    <rect x="366" y="389" width="96" height="8" rx="4" fill="#64748B"/>
    <rect x="366" y="403" width="48" height="7" rx="3.5" fill="#334155"/>
    <rect x="486" y="393" width="20" height="8" rx="4" fill="#38BDF8"/>
  </g>
  <!-- Bottom nav -->
  <rect x="320" y="470" width="200" height="52" rx="16" fill="#111C2E"/>
  <circle cx="356" cy="496" r="7" fill="#38BDF8"/>
  <circle cx="404" cy="496" r="7" fill="#334155"/>
  <circle cx="452" cy="496" r="7" fill="#334155"/>
  <circle cx="500" cy="496" r="7" fill="#334155"/>
</svg>
