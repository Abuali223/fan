<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" fill="none" role="img" aria-label="Abstract dashboard illustration">
  <defs>
    <linearGradient id="hv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="hv-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <linearGradient id="hv-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="hv-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Decorative gradient blob -->
  <circle cx="300" cy="250" r="230" fill="url(#hv-bg)" opacity="0.10"/>
  <circle cx="470" cy="120" r="70" fill="url(#hv-bg)" opacity="0.16"/>

  <!-- Main analytics card -->
  <g filter="url(#hv-shadow)">
    <rect x="90" y="90" width="360" height="250" rx="22" fill="url(#hv-card)"/>
    <rect x="118" y="120" width="120" height="14" rx="7" fill="#0F172A" opacity="0.85"/>
    <rect x="118" y="146" width="80" height="10" rx="5" fill="#94A3B8"/>
    <!-- Bars -->
    <rect x="120" y="210" width="34" height="90" rx="8" fill="url(#hv-bar)" opacity="0.55"/>
    <rect x="168" y="182" width="34" height="118" rx="8" fill="url(#hv-bar)" opacity="0.7"/>
    <rect x="216" y="228" width="34" height="72" rx="8" fill="url(#hv-bar)" opacity="0.55"/>
    <rect x="264" y="160" width="34" height="140" rx="8" fill="url(#hv-bar)"/>
    <rect x="312" y="200" width="34" height="100" rx="8" fill="url(#hv-bar)" opacity="0.7"/>
    <rect x="360" y="176" width="34" height="124" rx="8" fill="url(#hv-bar)" opacity="0.85"/>
  </g>

  <!-- Floating stat card -->
  <g filter="url(#hv-shadow)">
    <rect x="360" y="300" width="180" height="110" rx="20" fill="#0F172A"/>
    <circle cx="392" cy="336" r="16" fill="url(#hv-bg)"/>
    <path d="M386 336l4 4 8-8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="420" y="322" width="96" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="420" y="344" width="64" height="9" rx="4.5" fill="#38BDF8"/>
    <rect x="384" y="372" width="132" height="8" rx="4" fill="#FFFFFF" opacity="0.15"/>
    <rect x="384" y="388" width="96" height="8" rx="4" fill="#FFFFFF" opacity="0.15"/>
  </g>

  <!-- Floating trend line card -->
  <g filter="url(#hv-shadow)">
    <rect x="60" y="270" width="180" height="120" rx="20" fill="url(#hv-card)"/>
    <polyline points="82,352 112,330 142,342 172,306 202,318 222,292"
              fill="none" stroke="url(#hv-bar)" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="222" cy="292" r="6" fill="#2563EB"/>
    <rect x="82" y="296" width="70" height="10" rx="5" fill="#0F172A" opacity="0.8"/>
  </g>

  <!-- Orbiting nodes -->
  <circle cx="470" cy="210" r="9" fill="#38BDF8"/>
  <circle cx="120" cy="150" r="7" fill="#2563EB"/>
  <circle cx="500" cy="360" r="6" fill="#38BDF8" opacity="0.7"/>
</svg>
