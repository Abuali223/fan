<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460" fill="none" role="img" aria-label="Team collaborating on digital products">
  <defs>
    <linearGradient id="ab-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="ab-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <filter id="ab-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background frame -->
  <rect x="40" y="40" width="480" height="380" rx="28" fill="url(#ab-grad)" opacity="0.12"/>

  <!-- Central browser window -->
  <g filter="url(#ab-shadow)">
    <rect x="120" y="90" width="320" height="220" rx="18" fill="url(#ab-panel)"/>
    <rect x="120" y="90" width="320" height="40" rx="18" fill="#0F172A"/>
    <rect x="120" y="118" width="320" height="12" fill="#0F172A"/>
    <circle cx="144" cy="110" r="5" fill="#38BDF8"/>
    <circle cx="162" cy="110" r="5" fill="#2563EB"/>
    <circle cx="180" cy="110" r="5" fill="#FFFFFF" opacity="0.4"/>
    <!-- Content blocks -->
    <rect x="148" y="156" width="120" height="90" rx="12" fill="url(#ab-grad)" opacity="0.85"/>
    <rect x="288" y="156" width="124" height="18" rx="9" fill="#0F172A" opacity="0.8"/>
    <rect x="288" y="184" width="104" height="11" rx="5.5" fill="#94A3B8"/>
    <rect x="288" y="204" width="110" height="11" rx="5.5" fill="#94A3B8"/>
    <rect x="288" y="224" width="70" height="11" rx="5.5" fill="#94A3B8"/>
    <rect x="148" y="262" width="264" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="148" y="280" width="180" height="10" rx="5" fill="#CBD5E1"/>
  </g>

  <!-- Floating avatar chips -->
  <g filter="url(#ab-shadow)">
    <circle cx="110" cy="330" r="34" fill="#0F172A"/>
    <circle cx="110" cy="330" r="26" fill="url(#ab-grad)"/>
    <text x="110" y="338" font-family="Poppins, sans-serif" font-size="22" font-weight="700"
          fill="#FFFFFF" text-anchor="middle">A</text>
  </g>
  <g filter="url(#ab-shadow)">
    <circle cx="452" cy="120" r="30" fill="#0F172A"/>
    <circle cx="452" cy="120" r="22" fill="url(#ab-grad)"/>
    <text x="452" y="128" font-family="Poppins, sans-serif" font-size="20" font-weight="700"
          fill="#FFFFFF" text-anchor="middle">N</text>
  </g>

  <!-- Spark / plus badge -->
  <g filter="url(#ab-shadow)">
    <rect x="400" y="300" width="72" height="72" rx="20" fill="#FFFFFF"/>
    <path d="M436 322v28M422 336h28" stroke="url(#ab-grad)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
